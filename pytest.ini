[pytest]
testpaths = tests
# The app modules sit at the repo root, beside tests/.
pythonpath = .
addopts = -ra --strict-markers
markers =
    connect: needs the fake Connect server (demo/fake_connect.py); started once per session
    app: starts the app with `shiny run` in a subprocess
filterwarnings =
    # shinywidgets uses an ipywidgets API that ipywidgets deprecated.
    ignore:Widget.widgets is deprecated:DeprecationWarning
