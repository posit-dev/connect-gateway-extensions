name: Extensions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extensions:
    strategy:
      fail-fast: false
      matrix:
        extension:
          - gateway-usage-dashboard
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: posit-dev/connect-gallery-action/build-extension@main
        with:
          extension-name: ${{ matrix.extension }}
          extensions-dir: extensions
          release: ${{ github.ref_name == 'main' }}

  update-gallery:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    needs: [extensions]
    if: always() && github.ref_name == 'main'
    steps:
      # main is protected, so the default GITHUB_TOKEN cannot push the
      # regenerated extensions.json. The GitHub App is allowed to bypass the
      # pull request requirement.
      - name: Generate token for GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GATEWAY_EXTENSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATEWAY_EXTENSIONS_APP_PEM }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.generate-token.outputs.token }}

      - uses: posit-dev/connect-gallery-action@main
        with:
          extensions-dir: extensions
